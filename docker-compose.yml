version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: vbank_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mm2264764
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - vbank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vbank_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Zookeeper 
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vbank-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - vbank-net

  # 3. Apache Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vbank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTERBROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - vbank-net

  # 4. User Service
  user-service:
    build: ./user-service
    container_name: vbank-user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vbank_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Mm2264764
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - vbank-net

  # 5. Account Service
  account-service:
    build: ./account-service
    container_name: vbank-account-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vbank_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Mm2264764
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - vbank-net

  # 6. Transaction Service
  transaction-service:
    build: ./transaction-service
    container_name: vbank-transaction-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vbank_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Mm2264764
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - vbank-net

  # 7. Logging Service
  logging-service:
    build: ./logging-service
    container_name: vbank-logging-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/vbank_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=Mm2264764
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - vbank-net

  # 8. BFF Service (Backend for Frontend)
  bff-service:
    build: ./bff-service
    container_name: vbank-bff-service
    ports:
      - "8080:8080"
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - USER_SERVICE_URL=http://user-service:8081
      - ACCOUNT_SERVICE_URL=http://account-service:8082
      - TRANSACTION_SERVICE_URL=http://transaction-service:8083
    depends_on:
      - user-service
      - account-service
      - transaction-service
      - kafka
    networks:
      - vbank-net

volumes:
  postgres_data:

networks:
  vbank-net:
    driver: bridge